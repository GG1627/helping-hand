<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280"><title>Helping Hand implemented system and planned hardware integration</title><desc>Flex sensors and a six-axis IMU feed ESP32 static recognition. BLE connects the ESP32 to the Flutter app with word inference and local progress. HTTPS connects the phone to Firebase. Dashed elements show a planned nine-axis replacement IMU, piezo drivers, correction-to-cue logic, and an unfabricated custom PCB replacing perfboard.</desc><rect width="1800" height="1280" fill="white"/>
